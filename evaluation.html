<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>แบบประเมิน · Evaluation · ADAPT-Nan 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2ea;--surface:#fffdf8;--surface2:#efe9dc;--ink:#1f2a1e;--ink2:#4d5a4a;--muted:#7a8476;--line:#e2dccd;--green:#2c4a2a;--green2:#4f7a3f;--leaf:#cfe0bf;--terra:#a5432a;--terra-soft:#f5e4dc;--gold:#c8902e;--shadow:0 1px 2px rgba(30,40,25,.06),0 6px 20px rgba(30,40,25,.06);--radius:16px}
@media (prefers-color-scheme:dark){:root{--bg:#141a13;--surface:#1c241b;--surface2:#242e22;--ink:#ecf0e6;--ink2:#c2cbbc;--muted:#8d9888;--line:#2f3a2d;--green:#a9cf8f;--green2:#8fbf72;--leaf:#2f4527;--terra:#e48b6c;--terra-soft:#3a2620;--gold:#e0b25a;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:110px}
h1,h2,h3{font-family:"Noto Serif Thai","Noto Sans Thai",serif;line-height:1.25;margin:0}
a{color:var(--terra)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.back{color:var(--green);text-decoration:none;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langsw{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.langsw button{border:0;background:var(--surface);padding:6px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink2)}
.langsw button[aria-pressed=true]{background:var(--green);color:var(--bg)}
.hero{padding:24px 0 6px}
.hero h1{font-size:clamp(24px,5vw,34px);color:var(--green)}
.hero p{color:var(--ink2);margin:6px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin:14px 0}
.card h2{font-size:20px;color:var(--green);margin-bottom:6px}
.card h3{font-size:17px;color:var(--green)}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:640px){.cards2,.cards3{grid-template-columns:1fr}}
.role{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.role b{display:block;color:var(--green);font-size:17px}
.role small{color:var(--muted)}
.role[aria-pressed=true]{border-color:var(--green2);background:var(--leaf)}
label.f{display:block;font-weight:600;margin:12px 0 4px}
select,input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.row2{grid-template-columns:1fr}}
.item{padding:12px 0;border-top:1px dashed var(--line)}
.item:first-of-type{border-top:0}
.q{font-weight:600}
.q .id{display:inline-block;min-width:38px;color:var(--terra);font-weight:700}
.opts{display:grid;gap:5px;margin-top:8px}
.opts.n11{grid-template-columns:repeat(11,1fr);max-width:540px}
.opts.n10{grid-template-columns:repeat(10,1fr);max-width:500px}
.opts.n6{grid-template-columns:repeat(6,1fr);max-width:360px}
.opts.n5{grid-template-columns:repeat(5,1fr);max-width:300px}
.opts.txt{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.opts.n3{grid-template-columns:repeat(3,1fr);max-width:420px}
.opts button{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:7px 6px;cursor:pointer;font:inherit;font-weight:600;font-size:14px;color:var(--ink2);line-height:1.3}
.opts.txt button{text-align:left;padding:8px 10px;font-weight:500}
.opts button:hover{border-color:var(--green2)}
.opts button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:var(--bg)}
.ends{display:flex;justify-content:space-between;max-width:300px;font-size:11.5px;color:var(--muted);margin-top:2px}
.item.missing .opts,.item.missing .bnrow,.missing-sel{outline:2px solid var(--terra);outline-offset:3px;border-radius:8px}
.bnrow{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:8px;margin-top:6px;max-width:400px}
.bnrow span{font-size:13px;color:var(--muted);font-weight:600}
.bnrow .opts{margin-top:0}
.balrow{display:grid;grid-template-columns:minmax(120px,1fr) 2fr;gap:8px;align-items:center;margin-top:6px}
.balrow .opts{margin-top:0}
.w3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.other{margin-top:6px}
.att{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
@media (max-width:640px){.att{grid-template-columns:repeat(3,1fr)}}
.att div{font-size:12px;color:var(--muted)}
.att select{padding:6px;font-size:14px}
details.rub{margin-top:6px}
details.rub summary{cursor:pointer;color:var(--green2);font-size:13px}
.rubt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
@media (max-width:640px){.rubt{grid-template-columns:1fr 1fr}}
.rubt div{background:var(--surface2);border-radius:8px;padding:6px 8px;font-size:12.5px}
.rubt b{display:block;color:var(--green)}
.legend{font-size:13px;color:var(--ink2);background:var(--surface2);border-radius:10px;padding:8px 12px;margin:6px 0}
.peer{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0;background:var(--surface)}
.peer>summary{cursor:pointer;font-weight:700;color:var(--green);list-style:none;display:flex;justify-content:space-between;gap:8px}
.peer>summary::-webkit-details-marker{display:none}
.badge{font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--terra-soft);color:var(--terra);white-space:nowrap}
.badge.ok{background:var(--leaf);color:var(--green)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding:12px 16px}
.bar .prog{flex:1;font-size:14px;color:var(--ink2)}
.meter{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--green2);width:0}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:700;cursor:pointer;background:var(--terra);color:#fff;font-size:16px;font-family:inherit}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.note{border-left:4px solid var(--gold);background:var(--surface2);padding:10px 14px;border-radius:8px;font-size:14px}
.anon{border-left:4px solid var(--green2)}
.ok-card{border-left:6px solid var(--green2)}
.err{border-left:6px solid var(--terra)}
.hidden{display:none!important}
.sub{font-size:13px;color:var(--muted)}
.total{font-weight:700;color:var(--green)}
.sechead{font-size:13px;font-weight:700;color:var(--terra);letter-spacing:.02em;text-transform:uppercase}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="back" href="./" id="backLink"></a>
  <div class="langsw" role="group" aria-label="Language">
    <button data-lang="th" aria-pressed="true">ไทย</button><button data-lang="en" aria-pressed="false">EN</button>
  </div>
</div></header>

<main class="wrap">
  <section class="hero"><h1 id="hTitle"></h1><p id="hSub"></p></section>
  <div class="note hidden" id="noBackend"></div>

  <div class="card">
    <h2 id="lvlTitle"></h2>
    <div class="cards2" id="levels">
      <button class="role" data-level="field" aria-pressed="false"><b data-s="lvField"></b><small data-s="lvFieldD"></small></button>
      <button class="role" data-level="course" aria-pressed="false"><b data-s="lvCourse"></b><small data-s="lvCourseD"></small></button>
    </div>
  </div>

  <div id="fieldSetup" class="card hidden">
    <h2 data-s="whoTitle"></h2>
    <div class="cards3" id="roles">
      <button class="role" data-role="student" aria-pressed="false"><b data-s="rStudent"></b><small data-s="rStudentD"></small></button>
      <button class="role" data-role="mentor" aria-pressed="false"><b data-s="rMentor"></b><small data-s="rMentorD"></small></button>
      <button class="role" data-role="panel" aria-pressed="false"><b data-s="rPanel"></b><small data-s="rPanelD"></small></button>
    </div>
    <div class="row2">
      <div><label class="f" for="grp" data-s="group"></label><select id="grp"></select></div>
      <div><label class="f" for="who" id="whoLbl"></label><select id="who"></select><input type="text" id="whoText" class="hidden"></div>
    </div>
    <div id="panelRoleBox" class="hidden"><label class="f" for="panelRole" data-s="pRole"></label><select id="panelRole"></select></div>
  </div>

  <div id="formArea"></div>
  <div id="result"></div>
</main>

<div class="bar hidden" id="bar"><div class="wrap">
  <div class="prog"><span id="progTxt"></span><div class="meter"><i id="progBar"></i></div></div>
  <button class="btn" id="submit"></button>
</div></div>

<script>
// ===== CONFIG =====
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxbh8BruWfGGrG8MLjaouoBkxmVgQjQEHbtLq8g9XW2P4iX4tLkp_itsSuplyGADoMnOg/exec";
const DATA = {"groups": [{"no": 1, "en": "Market Integration", "th": "การเชื่อมโยงตลาด (Community-based Solution & Marketing)", "students": [["KU", "Mirei WAKATSUKI"], ["KU", "Saki UEMURA"], ["KU", "Yoshika YOKOYAMA"], ["KU", "Chan Rosa ORN"], ["KU", "Palat Lavichant"], ["RMUTL", "Papitchaya Kasosot"]], "mentors": [["NCC", "Phimonphan Sakidram"], ["ADAPT", "Jean-Christophe Castella"], ["ADAPT", "Nichaphart Inta"], ["ADAPT", "Sirinan Khamchu"]]}, {"no": 2, "en": "Integrated Farming", "th": "เกษตรผสมผสาน ความหลากหลายทางชีวภาพและวัฒนธรรม", "students": [["KU", "Yukie KATATA"], ["KU", "Haruna SUZUKI"], ["KU", "Kaito KURIHAR"], ["KU", "Thornthep Singrungruang"], ["KU", "Thammatida Promplod"], ["RMUTL", "Phatcharaphon Nopthon"]], "mentors": [["RMUTL", "Sakkarin Na Nan"], ["KU", "Buncha Chinnasri"], ["CU", "Kittipum Chansri"]]}, {"no": 3, "en": "Resources Management", "th": "การจัดการทรัพยากรธรรมชาติ", "students": [["KU", "Kokoro NIINOMI"], ["KU", "Maho MASAKI"], ["KU", "Sumire YAGI"], ["KU", "Kelyan SYLVESTRE"], ["KU", "Chanittha Arthan"], ["KU", "Janyawut Rodyodsroi"], ["RMUTL", "Thanaphat Saianan"]], "mentors": [["RMUTL", "Piyanuch Sinunta"], ["CU", "Pongchai Dumrongrojwatthana"], ["CU", "Lalita Srion"]]}], "levels": [{"range": "9–10", "th": "ดีเยี่ยม", "en": "Excellent"}, {"range": "7–8", "th": "ดี", "en": "Good"}, {"range": "5–6", "th": "พอใช้", "en": "Fair"}, {"range": "0–4", "th": "ต้องปรับปรุง", "en": "Needs improvement"}], "days": [{"d": "D2", "date": "9 พ.ย.", "date_en": "9 Nov"}, {"d": "D3", "date": "10 พ.ย.", "date_en": "10 Nov"}, {"d": "D4", "date": "11 พ.ย.", "date_en": "11 Nov"}, {"d": "D5", "date": "12 พ.ย.", "date_en": "12 Nov"}, {"d": "D6", "date": "13 พ.ย.", "date_en": "13 Nov"}, {"d": "D7", "date": "14 พ.ย.", "date_en": "14 Nov"}], "peer_items": [{"id": "S1", "th": "ช่วยงานกลุ่มอย่างเต็มที่และสม่ำเสมอ", "en": "Contributes fully and consistently to group work"}, {"id": "S2", "th": "เสนอความคิด/ข้อมูลที่เป็นประโยชน์ต่อการวิเคราะห์", "en": "Offers useful ideas and field information"}, {"id": "S3", "th": "สื่อสารชัดเจนและรับฟังความเห็นผู้อื่น", "en": "Communicates clearly and listens to others"}, {"id": "S4", "th": "ตรงต่อเวลาและรับผิดชอบงานที่ได้รับมอบหมาย", "en": "Punctual and reliable with assigned tasks"}, {"id": "S5", "th": "เคารพ ช่วยเหลือ และสร้างบรรยากาศที่ดีในทีม", "en": "Respectful, supportive, builds team spirit"}], "reflection": [{"th": "สิ่งสำคัญที่สุด 1–2 เรื่องที่ฉันได้เรียนรู้จากภาคสนามน่าน คืออะไร", "en": "What are the 1–2 most important things I learned in Nan?"}, {"th": "มุมมองของฉันต่อเกษตรนิเวศ/ชุมชนเปลี่ยนไปอย่างไร ยกตัวอย่างจากพื้นที่ที่ไปเยือน", "en": "How has my view of agroecology or rural communities changed? Give an example from a site."}, {"th": "บทบาทและสิ่งที่ฉันทำเพื่อกลุ่มคืออะไร", "en": "What was my role and contribution to the group?"}, {"th": "สิ่งที่ฉันควรพัฒนาต่อไป", "en": "What should I improve next time?"}, {"th": "ฉันจะนำสิ่งที่ได้เรียนรู้ไปใช้อย่างไร", "en": "How will I apply what I learned?"}], "form1_items": [{"id": "A1", "th": "การเข้าร่วมกิจกรรมครบถ้วนและตรงต่อเวลา", "en": "Attendance & punctuality (Day 2–7)", "d": [["เข้าร่วมครบทุกกิจกรรม ตรงเวลาสม่ำเสมอ", "Attends every session, always on time"], ["ขาด/สายเล็กน้อย 1 ครั้ง", "One minor absence or late arrival"], ["ขาดหรือสาย 2–3 ครั้ง", "2–3 absences or late arrivals"], ["ขาดหรือสายบ่อย กระทบงานกลุ่ม", "Frequently absent/late; affects group"]]}, {"id": "A2", "th": "ความกระตือรือร้นในการรับฟังและซักถามเจ้าของพื้นที่ (Observe)", "en": "Active listening & questioning with hosts (Observe)", "d": [["ตั้งใจฟัง จดบันทึก ถามคำถามเชิงลึกที่เชื่อมโยงกับธีมกลุ่ม", "Attentive, takes notes, asks probing theme-linked questions"], ["ตั้งใจฟัง ถามคำถามบ้าง", "Attentive, asks some questions"], ["ฟังแต่ไม่ค่อยซักถาม", "Listens but rarely asks"], ["ไม่สนใจ ทำกิจกรรมอื่น", "Disengaged or distracted"]]}, {"id": "A3", "th": "การลงมือปฏิบัติในฐานกิจกรรมภาคสนาม (Embody)", "en": "Hands-on engagement at field stations (Embody)", "d": [["ลงมือทำอย่างเต็มที่ ริเริ่มช่วยงานเกษตรกร", "Fully hands-on, takes initiative with farmers"], ["ลงมือทำตามที่ได้รับมอบหมาย", "Participates as instructed"], ["ลงมือทำบางส่วน ยืนดูเป็นส่วนใหญ่", "Partly involved, mostly observes"], ["ไม่ลงมือปฏิบัติ", "Does not take part"]]}, {"id": "A4", "th": "การมีส่วนร่วมในเกม WADIGA และเวที Mini Nan Forum", "en": "Engagement in WADIGA game & Mini Nan Forum", "d": [["เล่นบทบาท/ร่วมอภิปรายอย่างจริงจัง สะท้อนบทเรียนได้ชัด", "Plays role/debates seriously, draws clear lessons"], ["มีส่วนร่วมดี แสดงความคิดเห็นบ้าง", "Engaged, offers some views"], ["มีส่วนร่วมน้อย", "Limited involvement"], ["ไม่มีส่วนร่วม", "Not involved"]]}, {"id": "A5", "th": "ความเคารพชุมชน วัฒนธรรม และกติกาของพื้นที่", "en": "Respect for community, culture & site rules", "d": [["สุภาพ แต่งกายเหมาะสม ปฏิบัติตามกติกาเสมอ เป็นแบบอย่าง", "Courteous, dressed appropriately, role model"], ["ปฏิบัติตามกติกาเป็นส่วนใหญ่", "Mostly follows rules"], ["ต้องได้รับการเตือนบางครั้ง", "Needs occasional reminders"], ["ไม่เคารพกติกา/ชุมชน", "Disrespectful of rules or hosts"]]}, {"id": "B1", "th": "การมีส่วนร่วมวิพากษ์และประเมินพื้นที่ประจำวันกับกลุ่ม (Synthesize)", "en": "Contribution to daily group critique (Synthesize)", "d": [["เสนอประเด็นสำคัญจากข้อมูลภาคสนาม ช่วยสรุปงานกลุ่ม", "Brings key field-based points, helps synthesise"], ["ร่วมแสดงความเห็นสม่ำเสมอ", "Contributes regularly"], ["ร่วมแสดงความเห็นบางครั้ง", "Contributes occasionally"], ["แทบไม่มีส่วนร่วม", "Rarely contributes"]]}, {"id": "B2", "th": "การคิดเชิงระบบ เชื่อมโยงมิติ นิเวศ–เศรษฐกิจ–สังคม–วัฒนธรรม", "en": "Systems thinking: links ecological, economic, social & cultural dimensions", "d": [["เชื่อมโยงหลายมิติและผลกระทบต่อกันได้อย่างมีเหตุผล", "Links several dimensions and their interactions logically"], ["เชื่อมโยงได้ 2 มิติขึ้นไป", "Links at least two dimensions"], ["มองประเด็นแยกส่วน", "Treats issues in isolation"], ["ไม่สามารถวิเคราะห์ได้", "Little or no analysis"]]}, {"id": "B3", "th": "การสื่อสารและทำงานร่วมกับผู้อื่นในทีมต   strength:["จุดเด่น 1 ข้อ","One strength"], suggest:["ข้อเสนอแนะ 1 ข้อ","One suggestion"],

  f2Title:["แบบที่ 2 การนำเสนอผลงานกลุ่ม","Form 2 · Group presentation"], members:["สมาชิก","Members"],
  f2Str:["จุดเด่นของข้อเสนอ","Strengths of the proposal"], f2Imp:["สิ่งที่ควรพัฒนา / คำถามต่อยอด","To improve / questions to explore"],
  anon:["แบบสอบถามนี้ไม่ระบุตัวตน ระบบไม่บันทึกชื่อ อีเมล หรือเวลาที่ส่ง (บันทึกเฉพาะวันที่)","This questionnaire is anonymous: no name, e-mail or time of submission is recorded (date only)."],
  na:["N/A","N/A"], before:["ก่อนเรียน","Before"], now:["ตอนนี้","Now"], otherOpt:["อื่น ๆ","Other"], otherSpec:["โปรดระบุ","Please specify"],
  word:["คำที่","Word"], optional:["(ไม่บังคับ)","(optional)"],
  submit:["ส่ง","Submit"], sending:["กำลังส่ง…","Sending…"],
  prog:["ตอบแล้ว {d}/{n} ข้อ","{d}/{n} answered"],
  missing:["กรุณาตอบให้ครบทุกข้อที่มีตัวเลือก","Please answer all items with options."],
  missingWho:["กรุณาใส่ชื่อและบทบาทผู้ประเมิน","Please enter your name and role."],
  okTitle:["ส่งเรียบร้อย ขอบคุณครับ/ค่ะ 🙏","Submitted — thank you! 🙏"], okId:["รหัสการส่ง","Submission ID"],
  again:["ประเมินชุดใหม่","New evaluation"], dl:["ดาวน์โหลดสำเนา","Download a copy"],
  failT:["ส่งไม่สำเร็จ","Could not submit"], savedT:["บันทึกเป็นไฟล์แล้ว","Saved as a file"],
  failD:["ระบบดาวน์โหลดไฟล์คำตอบให้แล้ว กรุณาส่งไฟล์นี้ให้ผู้ประสานงาน หรือกดส่งอีกครั้งเมื่อมีสัญญาณอินเทอร์เน็ต (คำตอบยังอยู่ในหน้านี้)","Your answers were downloaded as a file — send it to the coordinator, or press Submit again when online (your answers are kept on this page)."]
};
let L = (new URLSearchParams(location.search).get('lang') || '').toLowerCase() === 'en' ? 'en' : 'th';
let level = (new URLSearchParams(location.search).get('level') || '').toLowerCase();
if (!['field','course'].includes(level)) level = null;
const s = (k, vars) => { let v = S[k][L === 'th' ? 0 : 1]; if (vars) for (const x in vars) v = v.replace('{' + x + '}', vars[x]); return v; };
const t = o => o ? (o[L] ?? o.th) : '';
const $ = q => document.querySelector(q);
const esc = x => String(x ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const connected = /^https:\/\/script\.google(usercontent)?\.com\//.test(SCRIPT_URL);

let role = null;
const state = {};
const required = new Set();

function syncURL(){ const p = new URLSearchParams(location.search); p.set('lang', L); if (level) p.set('level', level); else p.delete('level'); history.replaceState(null, '', '?' + p.toString()); }
function draftKey(){ return level === 'course' ? 'course' : [role, $('#grp').value, whoName()].join('|'); }
function store(){ try { localStorage.setItem('adaptEval:' + draftKey(), JSON.stringify(state)); } catch (e) {} }
function loadDraft(){ Object.keys(state).forEach(k => delete state[k]); try { Object.assign(state, JSON.parse(localStorage.getItem('adaptEval:' + draftKey()) || '{}')); } catch (e) {} }
function whoName(){ return role === 'panel' || (role === 'mentor' && $('#who').value === '__other') ? $('#whoText').value.trim() : $('#who').value; }
function group(){ return DATA.groups.find(g => String(g.no) === $('#grp').value); }

// ---------- static text ----------
function paintStatic(){
  document.documentElement.lang = L;
  document.querySelectorAll('.langsw button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === L));
  $('#backLink').textContent = s('back'); $('#hTitle').textContent = s('title'); $('#hSub').textContent = s('sub');
  $('#noBackend').textContent = s('noBackend'); $('#noBackend').classList.toggle('hidden', connected);
  $('#lvlTitle').textContent = s('lvlTitle'); $('#submit').textContent = s('submit');
  document.querySelectorAll('[data-s]').forEach(e => e.textContent = s(e.dataset.s));
  const g = $('#grp').value;
  $('#grp').innerHTML = `<option value="">${s('chooseGroup')}</option>` + DATA.groups.map(x => `<option value="${x.no}">${s('groupN')} ${x.no} · ${esc(L === 'th' ? x.th : x.en)}</option>`).join('');
  $('#grp').value = g;
  const pr = $('#panelRole').value; const R = S.pRoles[L === 'th' ? 0 : 1];
  $('#panelRole').innerHTML = `<option value="">${s('choose')}</option>` + S.pRoles[1].map((v, i) => `<option value="${v}">${R[i]}</option>`).join('');
  $('#panelRole').value = pr;
  $('#whoText').placeholder = s('fullName');
  fillWho(true);
}

document.querySelectorAll('.langsw button').forEach(b => b.onclick = () => { L = b.dataset.lang; syncURL(); paintStatic(); render(); });
document.querySelectorAll('[data-level]').forEach(b => b.onclick = () => { level = b.dataset.level; syncURL(); paintLevel(); render(); });
document.querySelectorAll('[data-role]').forEach(b => b.onclick = () => {
  role = b.dataset.role; document.querySelectorAll('[data-role]').forEach(x => x.setAttribute('aria-pressed', x === b));
  $('#panelRoleBox').classList.toggle('hidden', role !== 'panel'); fillWho(); render();
});
function paintLevel(){
  document.querySelectorAll('[data-level]').forEach(x => x.setAttribute('aria-pressed', x.dataset.level === level));
  $('#fieldSetup').classList.toggle('hidden', level !== 'field');
}
$('#grp').onchange = () => { fillWho(); render(); };
$('#who').onchange = () => { $('#whoText').classList.toggle('hidden', $('#who').value !== '__other'); render(); };
$('#whoText').oninput = () => updateProgress();
$('#panelRole').onchange = () => updateProgress();

function fillWho(keep){
  const g = group(), sel = $('#who'), txt = $('#whoText'), cur = sel.value;
  if (role === 'panel'){ sel.classList.add('hidden'); txt.classList.remove('hidden'); $('#whoLbl').textContent = s('evalName'); return; }
  sel.classList.remove('hidden'); if (!(keep && cur === '__other')) txt.classList.add('hidden');
  if (role === 'mentor'){
    $('#whoLbl').textContent = s('mentorName');
    sel.innerHTML = `<option value="">${s('choose')}</option>` + (g ? g.mentors.map(m => `<option>${esc(m[1])}</option>`).join('') : '') + `<option value="__other">${s('other')}</option>`;
  } else {
    $('#whoLbl').textContent = s('myName');
    sel.innerHTML = `<option value="">${s('chooseName')}</option>` + (g ? g.students.map(x => `<option>${esc(x[1])}</option>`).join('') : '');
  }
  if (keep) sel.value = cur;
}

// ---------- widgets ----------
function btns(key, opts, cls, req = true){
  if (req) required.add(key);
  const cur = state[key];
  const multi = Array.isArray(cur) || cls.includes('multi');
  return `<div class="opts ${cls}" data-key="${key}" ${multi ? 'data-multi="1"' : ''}>` + opts.map(o => {
    const on = multi ? (cur || []).includes(o.v) : cur === o.v;
    return `<button type="button" data-v="${esc(o.v)}" aria-pressed="${on}">${esc(o.label)}</button>`; }).join('') + '</div>';
}
const nums = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => ({ v: String(a + i), label: String(a + i) }));
function textArea(key, label, req){ if (req) required.add(key); return `<label class="f">${esc(label)}</label><textarea data-tkey="${key}">${esc(state[key] || '')}</textarea>`; }
function textIn(key, ph){ return `<input type="text" data-tkey="${key}" placeholder="${esc(ph)}" value="${esc(state[key] || '')}">`; }

// field-level item (0–10)
function rubric(d){
  return `<details class="rub"><summary>${s('showRubric')}</summary><div class="rubt">${d.map((x, i) =>
    `<div><b>${DATA.levels[i].range} ${esc(L === 'th' ? DATA.levels[i].th : DATA.levels[i].en)}</b>${esc(L === 'th' ? x[0] : x[1])}</div>`).join('')}</div></details>`;
}
function fItem(it, key, withRubric){
  return `<div class="item" data-item="${key}"><div class="q"><span class="id">${it.id}</span>${esc(L === 'th' ? it.th : it.en)}</div>${withRubric && it.d ? rubric(it.d) : ''}${btns(key, nums(0, 10), 'n11')}</div>`;
}

// ---------- render ----------
function render(){
  required.clear(); $('#result').innerHTML = '';
  if (level === 'course') return renderCourse();
  const g = group(), who = whoName(), area = $('#formArea');
  const ready = level === 'field' && role && g && (role === 'panel' || who);
  $('#bar').classList.toggle('hidden', !ready);
  if (!ready){ area.innerHTML = ''; return; }
  loadDraft();
  const legend = `<div class="legend">${s('scale10')}</div>`;
  let h = '';
  if (role === 'student'){
    const peers = g.students.filter(x => x[1] !== who);
    h += `<div class="card"><h2>3. ${s('f4Title')}</h2>${legend}`;
    DATA.peer_items.forEach(it => h += fItem(it, `self.${it.id}`));
    h += `<h3 style="margin-top:16px">${s('reflTitle')}</h3><p class="sub">${s('reflNote')}</p>`;
    DATA.reflection.forEach((q, i) => h += textArea(`self.R${i+1}`, `R${i+1}. ${t(q)}`, i < 2));
    h += `</div><div class="card"><h2>4. ${s('f3Title')}</h2><p class="sub">${s('f3Note', { n: peers.length })}</p>${legend}`;
    peers.forEach((p, k) => {
      h += `<details class="peer" ${k === 0 ? 'open' : ''} data-peer="${k}"><summary><span>${esc(p[1])} <span class="sub">(${p[0]})</span></span><span class="badge"></span></summary>`;
      DATA.peer_items.forEach(it => h += fItem(it, `peer.${k}.${it.id}`));
      h += textArea(`peer.${k}.strength`, s('strength')) + textArea(`peer.${k}.suggest`, s('suggest')) + '</details>';
    });
    h += '</div>';
  }
  if (role === 'mentor'){
    const A = S.att[L === 'th' ? 0 : 1];
    h += `<div class="card"><h2>3. ${s('f1Title')}</h2><p class="sub">${s('f1Note')}</p>${legend}</div>`;
    g.students.forEach((st, k) => {
      h += `<details class="peer card" ${k === 0 ? 'open' : ''} data-peer="${k}"><summary><span>${k+1}. ${esc(st[1])} <span class="sub">(${st[0]})</span></span><span class="badge"></span></summary>
        <div class="item"><div class="q"><span class="id">A1</span>${s('a1')} → <span class="total" data-a1="${k}">–</span>/10</div><div class="att">${
        DATA.days.map((d, j) => { const key = `f1.${k}.att${j}`; required.add(key);
          return `<div>${d.d} ${L === 'th' ? d.date : d.date_en}<select data-skey="${key}"><option value=""></option>${['1','0.5','0'].map((v, i) => `<option value="${v}" ${String(state[key]) === v ? 'selected' : ''}>${A[i]}</option>`).join('')}</select></div>`; }).join('')}</div></div>`;
      DATA.form1_items.filter(it => it.id !== 'A1').forEach(it => h += fItem(it, `f1.${k}.${it.id}`, true));
      h += textArea(`f1.${k}.comment`, s('comment')) + '</details>';
    });
  }
  if (role === 'panel'){
    h += `<div class="card"><h2>3. ${s('f2Title')} · ${s('groupN')} ${g.no}</h2><p class="sub">${s('members')}: ${g.students.map(x => esc(x[1])).join(', ')}</p>${legend}`;
    let part = '';
    DATA.form2_items.forEach(it => { const p = t(it.part); if (p !== part){ part = p; h += `<h3 style="margin-top:14px">${esc(part)}</h3>`; } h += fItem(it, `f2.${it.id}`, true); });
    h += textArea('f2.strength', s('f2Str')) + textArea('f2.improve', s('f2Imp')) + '</div>';
  }
  area.innerHTML = h; bind(); updateProgress();
}

function renderCourse(){
  loadDraft();
  const SC = COURSE.scales;
  let h = `<div class="card"><h2>${esc(t(COURSE.title))}</h2><p class="sub">${esc(t(COURSE.subtitle))}</p><p>${esc(t(COURSE.intro))}</p><div class="note anon">🔒 ${s('anon')}</div></div>`;
  COURSE.sections.forEach(sec => {
    h += `<div class="card"><h2>${esc(t(sec.title))}</h2>`;
    if (sec.note) h += `<p class="sub">${esc(t(sec.note))}</p>`;
    if (sec.scale) h += `<div class="legend">${esc(t(SC[sec.scale].legend))}</div>`;
    sec.items.forEach(it => {
      const key = 'c.' + it.id, q = `<div class="q"><span class="id">${it.id}</span>${esc(t(it.q))}${it.req ? '' : ` <span class="sub">${s('optional')}</span>`}</div>`;
      h += `<div class="item" data-item="${key}">${q}`;
      if (it.type === 'likert'){
        const sc = SC[it.scale];
        h += btns(key, nums(1, 5).concat([{ v: 'N/A', label: s('na') }]), 'n6') + `<div class="ends"><span>1 ${esc(t(sc.lo))}</span><span>5 ${esc(t(sc.hi))}</span></div>`;
      } else if (it.type === 'score10'){
        h += btns(key, nums(1, 10), 'n10');
      } else if (it.type === 'single' || it.type === 'multi'){
        const opts = it.opts.map(o => ({ v: o.v, label: o[L] })); if (it.other) opts.push({ v: 'Other', label: s('otherOpt') });
        if (it.type === 'multi' && !Array.isArray(state[key])) state[key] = state[key] ? [state[key]] : [];
        h += btns(key, opts, (it.opts.length <= 3 && !it.other ? 'n3' : 'txt') + (it.type === 'multi' ? ' multi' : ''));
        if (it.other) h += `<div class="other">${textIn(key + '_other', s('otherSpec'))}</div>`;
      } else if (it.type === 'words3'){
        h += `<div class="w3">${[1,2,3].map(i => textIn(`${key}_${i}`, `${s('word')} ${i}`)).join('')}</div>`;
      } else if (it.type === 'open'){
        h += `<textarea data-tkey="${key}">${esc(state[key] || '')}</textarea>`;
      } else if (it.type === 'balance'){
        h += it.rows.map(r => `<div class="balrow"><span>${esc(r[L])}</span>${btns(`${key}.${r.k}`, it.cols.map(c => ({ v: c.v, label: c[L] })), 'n3')}</div>`).join('');
      } else if (it.type === 'beforenow'){
        h += `<div class="bnrow"><span>${s('before')}</span>${btns(key + '.before', nums(1, 5), 'n5')}</div><div class="bnrow"><span>${s('now')}</span>${btns(key + '.now', nums(1, 5), 'n5')}</div>`;
      }
      h += '</div>';
    });
    h += '</div>';
  });
  $('#formArea').innerHTML = h; $('#bar').classList.remove('hidden'); bind(); updateProgress();
}

function bind(){
  document.querySelectorAll('.opts').forEach(sc => sc.onclick = e => {
    const b = e.target.closest('button'); if (!b) return; const k = sc.dataset.key, v = b.dataset.v;
    if (sc.dataset.multi){ const a = state[k] = Array.isArray(state[k]) ? state[k] : []; const i = a.indexOf(v); if (i >= 0) a.splice(i, 1); else a.push(v); b.setAttribute('aria-pressed', i < 0); }
    else { state[k] = v; sc.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); }
    const it = sc.closest('.item'); if (it) it.classList.remove('missing');
    store(); updateProgress();
  });
  document.querySelectorAll('[data-tkey]').forEach(x => x.oninput = () => { state[x.dataset.tkey] = x.value; store(); updateProgress(); });
  document.querySelectorAll('[data-skey]').forEach(x => x.onchange = () => { x.classList.remove('missing-sel'); if (x.value === '') delete state[x.dataset.skey]; else state[x.dataset.skey] = x.value; store(); updateProgress(); });
}

const num = v => (v === undefined || v === '' || v === 'N/A') ? null : +v;
function a1(k){ const v = DATA.days.map((_, j) => num(state[`f1.${k}.att${j}`])); return v.every(x => x !== null) ? Math.round(v.reduce((a, b) => a + b, 0) / 6 * 100) / 10 : null; }
function filled(k){ const v = state[k]; return Array.isArray(v) ? v.length > 0 : (v !== undefined && String(v).trim() !== ''); }

function updateProgress(){
  const req = [...required], done = req.filter(filled).length;
  let ok = done === req.length;
  if (level === 'field' && role === 'panel' && (!whoName() || !$('#panelRole').value)) ok = false;
  if (level === 'field' && role === 'mentor' && !whoName()) ok = false;
  $('#progTxt').textContent = s('prog', { d: done, n: req.length });
  $('#progBar').style.width = (req.length ? done / req.length * 100 : 0) + '%';
  document.querySelectorAll('[data-peer]').forEach(d => {
    const k = d.dataset.peer, pre = role === 'mentor' ? `f1.${k}.` : `peer.${k}.`;
    const mine = req.filter(r => r.startsWith(pre)), dn = mine.filter(filled).length, b = d.querySelector('.badge');
    if (role === 'mentor'){ const v = a1(k), x = d.querySelector('[data-a1]'); if (x) x.textContent = v === null ? '–' : v; }
    const tot = dn !== mine.length ? null : role === 'mentor'
      ? (a1(k) + DATA.form1_items.filter(i => i.id !== 'A1').reduce((sm, i) => sm + num(state[`f1.${k}.${i.id}`]), 0)).toFixed(1) + '/100'
      : DATA.peer_items.reduce((sm, i) => sm + num(state[`peer.${k}.${i.id}`]), 0) + '/50';
    if (b){ b.textContent = tot ? '✓ ' + tot : `${dn}/${mine.length}`; b.classList.toggle('ok', !!tot); }
  });
  $('#submit').dataset.ok = ok ? '1' : '';
}

// ---------- payloads ----------
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function buildPayload(){
  if (level === 'course'){
    const A = [['Lang', L]];
    COURSE.sections.forEach(sec => sec.items.forEach(it => {
      const k = 'c.' + it.id, v = state[k];
      if (it.type === 'single'){ A.push([it.id, v === 'Other' ? 'Other: ' + (state[k + '_other'] || '') : (v || '')]); }
      else if (it.type === 'multi'){ const a = (v || []).map(x => x === 'Other' ? 'Other: ' + (state[k + '_other'] || '') : x); A.push([it.id, a.join('; ')]); }
      else if (it.type === 'words3'){ A.push([it.id, [1,2,3].map(i => (state[`${k}_${i}`] || '').trim()).filter(Boolean).join(' · ')]); }
      else if (it.type === 'balance'){ it.rows.forEach(r => A.push([`${it.id}_${r.k}`, state[`${k}.${r.k}`] || ''])); }
      else if (it.type === 'beforenow'){ A.push([`${it.id}_before`, num(state[k + '.before'])]); A.push([`${it.id}_now`, num(state[k + '.now'])]); }
      else if (it.type === 'likert'){ A.push([it.id, v === 'N/A' ? 'N/A' : num(v)]); }
      else if (it.type === 'score10'){ A.push([it.id, num(v)]); }
      else A.push([it.id, (v || '').trim()]);
    }));
    return { role: 'course', submission_id: newId(), lang: L, answers: A };
  }
  const g = group(), who = whoName();
  const base = { submission_id: newId(), submitted_at: new Date().toISOString(), group: g.no, group_name: g.en, role, evaluator: who, lang: L };
  if (role === 'student'){
    const me = g.students.find(x => x[1] === who), peers = g.students.filter(x => x[1] !== who);
    return { ...base, institution: me ? me[0] : '',
      self: { scores: Object.fromEntries(DATA.peer_items.map(i => [i.id, num(state[`self.${i.id}`])])), reflection: DATA.reflection.map((_, i) => state[`self.R${i+1}`] || '') },
      peers: peers.map((p, k) => ({ name: p[1], scores: Object.fromEntries(DATA.peer_items.map(i => [i.id, num(state[`peer.${k}.${i.id}`])])), strength: state[`peer.${k}.strength`] || '', suggestion: state[`peer.${k}.suggest`] || '' })) };
  }
  if (role === 'mentor'){
    return { ...base, students: g.students.map((st, k) => ({ name: st[1], institution: st[0],
      attendance: DATA.days.map((_, j) => num(state[`f1.${k}.att${j}`])),
      scores: Object.assign({ A1: a1(k) }, Object.fromEntries(DATA.form1_items.filter(i => i.id !== 'A1').map(i => [i.id, num(state[`f1.${k}.${i.id}`])]))),
      comment: state[`f1.${k}.comment`] || '' })) };
  }
  return { ...base, evaluator_role: $('#panelRole').value, scores: Object.fromEntries(DATA.form2_items.map(i => [i.id, num(state[`f2.${i.id}`])])), strength: state['f2.strength'] || '', improve: state['f2.improve'] || '' };
}

function download(obj){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' }));
  a.download = obj.role === 'course' ? `ADAPT-Nan_course_eval_${obj.submission_id}.json` : `ADAPT-Nan_eval_${obj.role}_G${obj.group}_${String(obj.evaluator || 'anon').replace(/\W+/g, '_')}.json`;
  a.click();
}

$('#submit').onclick = async () => {
  if (!$('#submit').dataset.ok){
    const miss = [...required].filter(k => !filled(k));
    document.querySelectorAll('.item').forEach(it => {
      const k = it.dataset.item; it.classList.toggle('missing', !!k && miss.some(m => m === k || m.startsWith(k + '.')));
    });
    document.querySelectorAll('[data-skey]').forEach(x => x.classList.toggle('missing-sel', miss.includes(x.dataset.skey)));
    const first = document.querySelector('.item.missing, .missing-sel');
    if (first){ const d = first.closest('details'); if (d) d.open = true; first.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    const whoMiss = level === 'field' && ((role === 'panel' && (!whoName() || !$('#panelRole').value)) || (role === 'mentor' && !whoName()));
    $('#result').innerHTML = `<div class="card err">${whoMiss ? s('missingWho') : s('missing')}</div>`;
    if (!first) $('#result').scrollIntoView({ behavior: 'smooth' });
    return;
  }
  const payload = buildPayload(), btn = $('#submit');
  btn.disabled = true; btn.textContent = s('sending');
  let ok = false, note = '';
  if (connected){
    try { const r = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) }); const j = await r.json(); ok = !!j.ok; note = j.error || ''; }
    catch (e) { note = String(e); }
  }
  btn.textContent = s('submit'); btn.disabled = false;
  if (ok){
    try { localStorage.removeItem('adaptEval:' + draftKey()); } catch (e) {}
    $('#formArea').innerHTML = ''; $('#bar').classList.add('hidden');
    $('#result').innerHTML = `<div class="card ok-card"><h2>${s('okTitle')}</h2><p class="sub">${s('okId')}: ${payload.submission_id}</p>
      <button class="btn ghost" id="again">${s('again')}</button> <button class="btn ghost" id="dl">${s('dl')}</button></div>`;
    $('#again').onclick = () => location.reload(); $('#dl').onclick = () => download(payload);
    $('#result').scrollIntoView({ behavior: 'smooth' });
  } else {
    download(payload);
    $('#result').innerHTML = `<div class="card err"><h3>${connected ? s('failT') : s('savedT')}</h3><p>${s('failD')}</p>${note ? `<p class="sub">${esc(note)}</p>` : ''}</div>`;
    $('#result').scrollIntoView({ behavior: 'smooth' });
  }
};

paintStatic(); paintLevel(); syncURL(); render();
</script>
</body>
</html>
